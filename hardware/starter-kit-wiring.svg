<text x="620" y="545.0" font-size="14" text-anchor="start" font-weight="bold" fill="#191919">20k</text>
<polyline points="600,580 600,588" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
