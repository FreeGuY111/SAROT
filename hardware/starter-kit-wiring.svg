<text x="560" y="640" font-size="14" text-anchor="start" font-weight="normal" fill="#666666">⏚ = connect to GND (black rail)</text>
<text x="40" y="920" font-size="15" text-anchor="start" font-weight="normal" fill="#191919">1. Red wires of both sensors go to the ESP32 5V pin. Black wires go to GND.</text>
<text x="40" y="944" font-size="15" text-anchor="start" font-weight="normal" fill="#191919">2. Each yellow wire goes through a 10k resistor to its GPIO pin. A 20k resistor goes from that pin to GND.</text>
<text x="40" y="968" font-size="15" text-anchor="start" font-weight="normal" fill="#191919">3. The resistors bring the sensor's 5 V signal down to 3.3 V. Do not skip them.</text>
<text x="40" y="992" font-size="15" text-anchor="start" font-weight="normal" fill="#191919">4. Wires that cross without a dot are not connected.</text>
