<text x="190" y="570" font-size="14" text-anchor="start" font-weight="normal" fill="#666666">water flow →</text>
<text x="960" y="560" font-size="20" text-anchor="start" font-weight="bold" fill="#0a66c2">3. How to assemble</text>
<rect x="960" y="584" width="28" height="28" fill="#0a66c2" stroke="none" stroke-width="1.5"/>
<text x="974" y="604" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text>
<text x="1000" y="602" font-size="15" text-anchor="start" font-weight="normal" fill="#191919">Wrap PTFE tape 5–6 turns clockwise on every male thread:</text>
<text x="1000" y="623" font-size="14" text-anchor="start" font-weight="normal" fill="#666666">both ends of the sensor, the small tap and the plug.</text>
<rect x="960" y="656" width="28" height="28" fill="#0a66c2" stroke="none" stroke-width="1.5"/>
<text x="974" y="676" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">2</text>
<text x="1000" y="674" font-size="15" text-anchor="start" font-weight="normal" fill="#191919">Screw the hose connector onto the sensor inlet</text>
<text x="1000" y="695" font-size="14" text-anchor="start" font-weight="normal" fill="#666666">(the end the arrow starts from).</text>
<rect x="960" y="728" width="28" height="28" fill="#0a66c2" stroke="none" stroke-width="1.5"/>
<text x="974" y="748" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text>
<text x="1000" y="746" font-size="15" text-anchor="start" font-weight="normal" fill="#191919">Screw the tee onto the sensor outlet.</text>
<text x="1000" y="767" font-size="14" text-anchor="start" font-weight="normal" fill="#666666">Hand-tight plus a quarter turn. Do not over-tighten plastic.</text>
<rect x="960" y="800" width="28" height="28" fill="#0a66c2" stroke="none" stroke-width="1.5"/>
<text x="974" y="820" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">4</text>
<text x="1000" y="818" font-size="15" text-anchor="start" font-weight="normal" fill="#191919">Screw the small tap into the bottom of the tee</text>
<text x="1000" y="839" font-size="14" text-anchor="start" font-weight="normal" fill="#666666">and the plug into the side.</text>
<rect x="960" y="872" width="28" height="28" fill="#0a66c2" stroke="none" stroke-width="1.5"/>
<text x="974" y="892" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">5</text>
<text x="1000" y="890" font-size="15" text-anchor="start" font-weight="normal" fill="#191919">Push the hose onto the hose connector and tighten a clip.</text>
<text x="1000" y="911" font-size="14" text-anchor="start" font-weight="normal" fill="#666666">Other end on the home tap, also with a clip.</text>
<rect x="960" y="944" width="28" height="28" fill="#0a66c2" stroke="none" stroke-width="1.5"/>
<text x="974" y="964" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">6</text>
<text x="1000" y="962" font-size="15" text-anchor="start" font-weight="normal" fill="#191919">Put the bucket under the small tap. Turn the home tap on slowly</text>
<text x="1000" y="983" font-size="14" text-anchor="start" font-weight="normal" fill="#666666">and check every joint for drips. Re-tape any that leak.</text>
</svg>