<text x="40" y="48" font-size="30" text-anchor="start" font-weight="bold" fill="#191919">SROT starter kit: how to set it up</text>
<text x="40" y="78" font-size="17" text-anchor="start" font-weight="normal" fill="#666666">One flow sensor. A leak shows up as water that never stops flowing.</text>
