<rect x="660" y="473" width="30" height="30" fill="#0a66c2" stroke="none" stroke-width="1.5"/>
<text x="675" y="494" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text>
<text x="560" y="700" font-size="15" text-anchor="end" font-weight="bold" fill="#191919">Small tap = the "leak"</text>
