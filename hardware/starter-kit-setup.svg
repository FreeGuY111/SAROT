<text x="517" y="642" font-size="14" text-anchor="middle" font-weight="normal" fill="#666666">arrow points away from the tap</text>
<rect x="430" y="490" width="30" height="30" fill="#0a66c2" stroke="none" stroke-width="1.5"/>
