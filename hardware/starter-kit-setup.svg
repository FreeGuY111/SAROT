<text x="570" y="192" font-size="13" text-anchor="middle" font-weight="normal" fill="#666666">breadboard</text>
<rect x="665" y="205" width="130" height="70" fill="#1f3b57" stroke="none" stroke-width="1.5"/>
<text x="730" y="245" font-size="16" text-anchor="middle" font-weight="bold" fill="#ffffff">ESP32</text>
<rect x="815" y="205" width="95" height="70" fill="#37474f" stroke="none" stroke-width="1.5"/>
<text x="862" y="238" font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff">Power</text>
<text x="862" y="255" font-size="13" text-anchor="middle" font-weight="bold" fill="#ffffff">bank</text>
<path d="M795 250 H815" fill="none" stroke="#9e9e9e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="925" y="160" width="30" height="30" fill="#0a66c2" stroke="none" stroke-width="1.5"/>
