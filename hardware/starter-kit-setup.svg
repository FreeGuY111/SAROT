<text x="760" y="576" font-size="14" text-anchor="start" font-weight="normal" fill="#666666">(closes this side)</text>
<rect x="660" y="582" width="30" height="40" fill="#c9a227" stroke="#8a6d1f" stroke-width="1.5"/>
<rect x="652" y="622" width="46" height="22" fill="#9e9e9e" stroke="none" stroke-width="1.5"/>
